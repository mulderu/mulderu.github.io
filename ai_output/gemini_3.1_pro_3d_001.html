<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 인체 모형 조종기</title>
    <!-- Tailwind CSS (UI 스타일링 용도) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c; /* 배경색 */
            touch-action: none; /* 모바일에서 드래그 시 화면 스크롤 방지 */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .instruction-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* UI 패널 뒤의 캔버스 클릭 가능하게 함 */
        }
    </style>
</head>
<body>

    <!-- UI 패널 -->
    <div class="instruction-panel bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-2xl shadow-2xl text-white max-w-sm">
        <h1 class="text-2xl font-bold mb-2 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            3D 인체 모형 조종
        </h1>
        <p class="text-sm text-gray-300 mb-4">마우스나 터치로 각 부위를 제어해보세요.</p>
        <ul class="text-sm space-y-2 text-gray-200">
            <li class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-400"></span> <strong>선택:</strong> 원하는 신체 부위를 클릭</li>
            <li class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-400"></span> <strong>조작:</strong> 클릭한 상태로 마우스 드래그</li>
            <li class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-400"></span> <strong>몸통 조작:</strong> 모형 전체가 회전합니다.</li>
        </ul>
    </div>

    <!-- 3D 캔버스가 렌더링될 컨테이너 -->
    <div id="canvas-container"></div>

    <script>
        // --- 1. 기본 Scene, Camera, Renderer 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b); // Slate-800 색상 배경
        scene.fog = new THREE.Fog(0x1e293b, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 2. 조명 (Lighting) 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 5;
        dirLight.shadow.camera.bottom = -5;
        dirLight.shadow.camera.left = -5;
        dirLight.shadow.camera.right = 5;
        scene.add(dirLight);

        // 바닥 그리드
        const gridHelper = new THREE.GridHelper(20, 20, 0x475569, 0x334155);
        scene.add(gridHelper);

        // --- 3. 인체 모형 재질 및 형상 설정 ---
        const defaultMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x94a3b8, // 기본 회색빛 
            shininess: 30 
        });
        const activeColor = 0x3b82f6; // 활성화 시 파란색

        // 부위별 크기 (BoxGeometry)
        const sizes = {
            torso: [1.2, 1.6, 0.6],
            head: [0.6, 0.6, 0.6],
            arm: [0.35, 1.4, 0.35],
            leg: [0.4, 1.6, 0.4]
        };

        const geometries = {
            torso: new THREE.BoxGeometry(...sizes.torso),
            head: new THREE.BoxGeometry(...sizes.head),
            arm: new THREE.BoxGeometry(...sizes.arm),
            leg: new THREE.BoxGeometry(...sizes.leg)
        };

        // 인터랙션 대상 메쉬들을 저장할 배열
        const interactableMeshes = [];

        // 메쉬 생성 유틸리티 (메쉬를 생성하고 부모 피벗에 추가)
        function createBodyPart(geometry, yOffset, name, type) {
            const mesh = new THREE.Mesh(geometry, defaultMaterial.clone());
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            // 회전 중심(피벗)을 기준으로 메쉬의 실제 위치 조정
            mesh.position.y = yOffset;
            mesh.name = name;
            
            interactableMeshes.push(mesh); // 광선 추적(Raycast) 배열에 추가
            return mesh;
        }

        // --- 4. 인체 계층 구조 (Rigging) 조립 ---
        // 전체 모델을 담을 루트 그룹
        const humanGroup = new THREE.Group();
        humanGroup.position.y = 2.0; // 모델을 바닥 위로 올림
        scene.add(humanGroup);

        // 4.1 몸통 (Torso) - 모든 부위의 중심
        const torsoPivot = new THREE.Group();
        torsoPivot.userData = { type: 'torso' };
        humanGroup.add(torsoPivot);
        
        const torsoMesh = createBodyPart(geometries.torso, 0, 'TorsoMesh', 'torso');
        torsoPivot.add(torsoMesh);

        // 4.2 머리 (Head) - 몸통 위쪽에 부착
        const headPivot = new THREE.Group();
        headPivot.position.set(0, sizes.torso[1] / 2 + 0.1, 0); // 몸통 맨 위 + 약간의 목 간격
        headPivot.userData = { type: 'head' };
        torsoPivot.add(headPivot);

        const headMesh = createBodyPart(geometries.head, sizes.head[1] / 2, 'HeadMesh', 'head');
        headPivot.add(headMesh);

        // 4.3 왼쪽 팔 (Left Arm)
        const leftArmPivot = new THREE.Group();
        leftArmPivot.position.set(-(sizes.torso[0] / 2 + sizes.arm[0] / 2 + 0.1), sizes.torso[1] / 2 - 0.2, 0); // 어깨 위치
        leftArmPivot.userData = { type: 'arm_l' };
        torsoPivot.add(leftArmPivot);

        const leftArmMesh = createBodyPart(geometries.arm, -sizes.arm[1] / 2 + 0.2, 'LeftArmMesh', 'arm');
        leftArmPivot.add(leftArmMesh);

        // 4.4 오른쪽 팔 (Right Arm)
        const rightArmPivot = new THREE.Group();
        rightArmPivot.position.set(sizes.torso[0] / 2 + sizes.arm[0] / 2 + 0.1, sizes.torso[1] / 2 - 0.2, 0); // 어깨 위치
        rightArmPivot.userData = { type: 'arm_r' };
        torsoPivot.add(rightArmPivot);

        const rightArmMesh = createBodyPart(geometries.arm, -sizes.arm[1] / 2 + 0.2, 'RightArmMesh', 'arm');
        rightArmPivot.add(rightArmMesh);

        // 4.5 왼쪽 다리 (Left Leg)
        const leftLegPivot = new THREE.Group();
        leftLegPivot.position.set(-(sizes.torso[0] / 4), -sizes.torso[1] / 2 - 0.1, 0); // 골반 왼쪽
        leftLegPivot.userData = { type: 'leg_l' };
        torsoPivot.add(leftLegPivot);

        const leftLegMesh = createBodyPart(geometries.leg, -sizes.leg[1] / 2, 'LeftLegMesh', 'leg');
        leftLegPivot.add(leftLegMesh);

        // 4.6 오른쪽 다리 (Right Leg)
        const rightLegPivot = new THREE.Group();
        rightLegPivot.position.set(sizes.torso[0] / 4, -sizes.torso[1] / 2 - 0.1, 0); // 골반 오른쪽
        rightLegPivot.userData = { type: 'leg_r' };
        torsoPivot.add(rightLegPivot);

        const rightLegMesh = createBodyPart(geometries.leg, -sizes.leg[1] / 2, 'RightLegMesh', 'leg');
        rightLegPivot.add(rightLegMesh);


        // --- 5. 마우스/터치 인터랙션 (Raycaster & Drag Logic) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        
        let isDragging = false;
        let selectedGroup = null; // 현재 회전시킬 피벗 그룹
        let selectedMesh = null;  // 색상을 변경할 메쉬
        let previousPointer = { x: 0, y: 0 };

        // 회전 각도 제한 함수 (관절이 꺾이는 한계 설정)
        function clampRotation(group) {
            const type = group.userData.type;
            
            if (type === 'head') {
                group.rotation.x = THREE.MathUtils.clamp(group.rotation.x, -0.8, 0.8); // 끄덕이기
                group.rotation.y = THREE.MathUtils.clamp(group.rotation.y, -1.2, 1.2); // 도리도리
                group.rotation.z = 0; // 갸우뚱 제한
            } else if (type === 'arm_l') {
                group.rotation.x = THREE.MathUtils.clamp(group.rotation.x, -Math.PI, Math.PI); // 앞뒤 회전 자유
                group.rotation.z = THREE.MathUtils.clamp(group.rotation.z, -0.2, Math.PI - 0.5); // 옆으로 들기 (몸 안쪽 파고들지 않게)
            } else if (type === 'arm_r') {
                group.rotation.x = THREE.MathUtils.clamp(group.rotation.x, -Math.PI, Math.PI);
                group.rotation.z = THREE.MathUtils.clamp(group.rotation.z, -Math.PI + 0.5, 0.2); 
            } else if (type === 'leg_l') {
                group.rotation.x = THREE.MathUtils.clamp(group.rotation.x, -Math.PI / 1.5, Math.PI / 4); // 앞뒤 차기
                group.rotation.z = THREE.MathUtils.clamp(group.rotation.z, -0.1, 0.5); // 다리 찢기 제한
            } else if (type === 'leg_r') {
                group.rotation.x = THREE.MathUtils.clamp(group.rotation.x, -Math.PI / 1.5, Math.PI / 4);
                group.rotation.z = THREE.MathUtils.clamp(group.rotation.z, -0.5, 0.1);
            }
        }

        function onPointerDown(event) {
            // 터치 또는 마우스 좌표 계산 (정규화된 디바이스 좌표: -1 ~ +1)
            const clientX = event.clientX ?? event.touches?.[0].clientX;
            const clientY = event.clientY ?? event.touches?.[0].clientY;

            if (clientX === undefined) return;

            pointer.x = (clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(clientY / window.innerHeight) * 2 + 1;

            // 카메라 기준으로 광선 발사
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(interactableMeshes);

            if (intersects.length > 0) {
                isDragging = true;
                selectedMesh = intersects[0].object;
                selectedGroup = selectedMesh.parent; // 해당 메쉬의 피벗 그룹을 선택
                
                // 선택된 메쉬 색상 강조
                selectedMesh.material.color.setHex(activeColor);
                selectedMesh.material.emissive.setHex(0x112244);
                
                previousPointer.x = clientX;
                previousPointer.y = clientY;
                
                // 드래그 중 텍스트 선택 등 방지
                document.body.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(event) {
            if (!isDragging || !selectedGroup) return;

            const clientX = event.clientX ?? event.touches?.[0].clientX;
            const clientY = event.clientY ?? event.touches?.[0].clientY;

            if (clientX === undefined) return;

            // 이전 마우스 위치와의 차이 계산
            const deltaX = clientX - previousPointer.x;
            const deltaY = clientY - previousPointer.y;
            
            const type = selectedGroup.userData.type;
            const sensitivity = 0.015; // 회전 민감도

            // 선택된 부위에 따라 회전 축 매핑
            if (type === 'torso') {
                // 몸통은 전체 회전 (Y축 기준 좌우, X축 기준 앞뒤)
                selectedGroup.rotation.y += deltaX * sensitivity;
                selectedGroup.rotation.x += deltaY * sensitivity;
            } else if (type === 'head') {
                selectedGroup.rotation.y += deltaX * sensitivity;
                selectedGroup.rotation.x += deltaY * sensitivity;
            } else if (type.startsWith('arm') || type.startsWith('leg')) {
                // 팔/다리는 Y축 마우스 이동으로 앞뒤(X축) 회전, X축 마우스 이동으로 옆(Z축) 회전
                selectedGroup.rotation.x += deltaY * sensitivity;
                
                // 마우스 좌우 이동은 Z축 (옆으로 벌리기)에 적용
                // 왼쪽, 오른쪽 부위에 따라 부호 방향 조정
                if (type.endsWith('_l')) {
                    selectedGroup.rotation.z += deltaX * sensitivity;
                } else {
                    selectedGroup.rotation.z -= deltaX * sensitivity;
                }
            }

            // 관절 회전 한계 적용
            clampRotation(selectedGroup);

            // 현재 좌표 갱신
            previousPointer.x = clientX;
            previousPointer.y = clientY;
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = 'default';
                
                if (selectedMesh) {
                    // 원래 색상으로 복구
                    selectedMesh.material.color.setHex(0x94a3b8);
                    selectedMesh.material.emissive.setHex(0x000000);
                    selectedMesh = null;
                    selectedGroup = null;
                }
            }
        }

        // 이벤트 리스너 등록 (Pointer 이벤트 사용으로 마우스/터치 모두 지원)
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);

        // --- 6. 창 크기 조절 대응 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            // 랜더링
            renderer.render(scene, camera);
        }

        // 실행
        animate();

    </script>
</body>
</html>
